# This file was generated by bitbake-layers create-layer
# and is the required file for a Yocto layer.

BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-customer-app"
BBFILE_PATTERN_meta-customer-app = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-customer-app = "6"

LAYERDEPENDS_meta-customer-app = "core"
LAYERSERIES_COMPAT_meta-customer-app = "mickledore"
